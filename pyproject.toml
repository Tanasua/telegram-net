[project]
name = "telegram-net"
version = "0.1.0"
description = "Мережа телеграм-каналів місцевих новин Житомирської області"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "openai>=1.40",
    "pydantic>=2.0",
    "telethon>=1.36",
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "python-dotenv>=1.0",
    "gspread>=6.1",
    "google-auth>=2.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
