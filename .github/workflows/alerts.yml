name: Air raid alerts

# Сигнали тривоги й відбою: цикл, що раз на 30 с читає канал Житомирської ОВА
# і за шаблоном публікує сигнали в канали відповідного району (src/telegram_net/alerts.py).
#
# Працює цілодобово: кожен запуск на старті сам ставить у чергу наступний
# (workflow_dispatch), тож новий починається щойно закінчився попередній —
# незалежно від розкладу GitHub, який запізнюється на години. Cron лишається
# лише як запасний перезапуск, якщо ланцюжок колись обірветься. Для публічного
# репозиторію хвилини GitHub Actions безкоштовні й не лімітовані.
#
# Цей цикл — ще й «годинник» мережі (src/telegram_net/ticker.py): щохвилини він
# запускає чергу постів, погоду, нічну атаку й курс валют у їхні вікна.
#
# Новий код у main цикл підхоплює сам: раз на 5 хв звіряє коміт гілки з тим,
# з яким стартував, і за розбіжності завершується — наступний запуск (уже в
# черзі) стартує з новим кодом. Інакше правки доходили в канали лише за години.
#
# Між запусками курсор і райони з тривогою зберігаються в кеші Actions: сигнал,
# що прийшов під час перезапуску, новий запуск надішле (якщо він не старший за
# 10 хв), а вже надіслані не повторить.
#
# На початку тривоги й далі раз на 30 хв, поки вона триває, у канали району йде
# знімок карти NEPTUN (src/telegram_net/neptun.py; chromium ставиться тут).
on:
  schedule:
    - cron: "7 0,5,10,15,20 * * *"
  workflow_dispatch: {}

concurrency:
  group: telegram-net-alerts
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # годинник і ланцюжок запусків — через workflow_dispatch

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Queue the next run (keeps the loop going without cron)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/alerts.yml/dispatches" \
            -d '{"ref":"${{ github.event.repository.default_branch }}"}' -o /dev/null -w "next run queued: %{http_code}\n"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --quiet "httpx>=0.27" "beautifulsoup4>=4.12" "lxml>=5.2" "playwright>=1.45"
          playwright install --with-deps chromium

      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: work/alerts_state.json
          key: alerts-state-${{ github.run_id }}
          restore-keys: alerts-state-

      - name: Relay alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          TICKER_REF: ${{ github.event.repository.default_branch }}
        run: PYTHONPATH=src python -m telegram_net.cli alerts --interval 30 --max-minutes 320 --state-file work/alerts_state.json

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work/alerts_state.json
          key: alerts-state-${{ github.run_id }}
