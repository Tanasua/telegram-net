name: Air raid alerts

# Сигнали тривоги й відбою: цикл, що раз на 30 с читає канал Житомирської ОВА
# і за шаблоном публікує сигнали в канали відповідного району (src/telegram_net/alerts.py).
#
# Працює цілодобово: кожен запуск триває 5 год 20 хв, а новий стартує кожні
# 5 годин і стає в чергу (concurrency), тож наступний починається щойно
# закінчився попередній. Для публічного репозиторію хвилини GitHub Actions
# безкоштовні й не лімітовані.
#
# Між запусками курсор і райони з тривогою зберігаються в кеші Actions: сигнал,
# що прийшов під час перезапуску, новий запуск надішле (якщо він не старший за
# 10 хв), а вже надіслані не повторить.
on:
  schedule:
    - cron: "7 0,5,10,15,20 * * *"
  workflow_dispatch: {}

concurrency:
  group: telegram-net-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet "httpx>=0.27" "beautifulsoup4>=4.12" "lxml>=5.2" "playwright>=1.45"

      # Chromium потрібен для скріншотів мапи Нептуна (neptun.py). Якщо він
      # не встановиться, сигнали все одно працюватимуть — без знімків.
      - name: Install Chromium
        continue-on-error: true
        run: python -m playwright install --with-deps chromium

      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: work/alerts_state.json
          key: alerts-state-${{ github.run_id }}
          restore-keys: alerts-state-

      - name: Relay alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: PYTHONPATH=src python -m telegram_net.cli alerts --interval 30 --max-minutes 320 --state-file work/alerts_state.json

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work/alerts_state.json
          key: alerts-state-${{ github.run_id }}
