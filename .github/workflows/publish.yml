name: Publish editor decisions

# Редактор (Claude) пушить файл рішень outbox/<run_id>.json у гілку claude/**.
# Цей workflow перевіряє рішення, ставить пости в чергу з інтервалом між постами
# одного каналу (перший пост каналу виходить одразу) і зберігає стан у гілку за
# замовчуванням. Решту черги надсилає drain.yml.
#
# Стан збирається так: published.json і queue.json беруться з гілки за
# замовчуванням (їх пишуть лише цей workflow і drain.yml), а state.json
# (курсори, пул кандидатів) — з коміту редактора. Тому черга, надіслана поки
# редактор працював, не перетирається.
on:
  push:
    branches: ["claude/**"]
    paths: ["outbox/*.json"]

concurrency:
  group: telegram-net-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Take the editor's decisions and collection state
        run: |
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout FETCH_HEAD -- outbox
          git checkout FETCH_HEAD -- state/state.json 2>/dev/null || echo "У коміті редактора немає state.json"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet "httpx>=0.27"

      - name: Publish
        id: publish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          shopt -s nullglob
          files=(outbox/*.json)
          if [ ${#files[@]} -eq 0 ]; then echo "Немає файлів рішень"; exit 0; fi
          PYTHONPATH=src python -m telegram_net.cli publish "${files[@]}"

      - name: Save state to the default branch
        if: always() && steps.publish.outputs.save_state == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "telegram-net-bot"
          git config user.email "actions@users.noreply.github.com"
          git reset -q -- outbox && git checkout -q -- outbox 2>/dev/null || true
          git clean -fdq outbox
          git add state
          git diff --cached --quiet || git commit -m "Update pipeline state"
          git push origin "HEAD:$DEFAULT_BRANCH"

      - name: Delete the run branch
        if: always() && steps.publish.outputs.cleanup_branch == 'true' && github.ref_name != github.event.repository.default_branch
        run: git push origin --delete "$GITHUB_REF_NAME" || true
