name: Hourly news pipeline

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: telegram-net-scheduler
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Restore Telethon session (створена один раз локально, див. scripts/create_telethon_session.py)
        run: echo "${{ secrets.TELEGRAM_SESSION_B64 }}" | base64 -d > telegram_net_reader.session

      - name: Run pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_NAME: telegram_net_reader
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_CLASSIFIER_MODEL: ${{ secrets.OPENAI_CLASSIFIER_MODEL }}
          OPENAI_GENERATOR_MODEL: ${{ secrets.OPENAI_GENERATOR_MODEL }}
          DATABASE_URL: sqlite:///state/telegram_net.db
        run: |
          mkdir -p state
          python -m telegram_net.scheduler

      - name: Persist pipeline state back to the repo
        run: |
          git config user.name "telegram-net-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/telegram_net.db
          git diff --cached --quiet || git commit -m "Update pipeline state"
          git push
