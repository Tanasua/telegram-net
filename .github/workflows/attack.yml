name: Night attack summary

# Щоранку — інфографіка «Нічна атака» в кожен канал (src/telegram_net/attack.py):
# цифри з ранкового зведення Повітряних сил ЗСУ і карта областей за кількістю
# згадок у нічних повідомленнях про шахеди й ракети. Без моделей і токенів.
#
# Зведення виходить близько 08:00 за Києвом. GitHub не знає про літній час і
# часом пропускає заплановані запуски, тому спроб кілька (о :11 і :41 з 05:00 до
# 08:59 UTC). Код публікує лише з 08:30 до 11:00, лише коли зведення вже є, і
# лише раз на добу; зайві спроби — кілька секунд.
#
# ВИМКНЕНО (рішення власника 16.11.2026: щоденне зведення нудне) — розкладу немає,
# годинник (ticker.py) його не запускає. Лише ручний запуск з --force.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Опублікувати зараз, не чекаючи 08:30"
        type: boolean
        default: false

concurrency:
  group: telegram-net-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  attack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Найсвіжіший стан гілки, а не коміт на момент запуску: запуски стоять
          # у черзі (concurrency), і попередній міг уже записати state.
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet "httpx>=0.27" "pillow>=10.0" "beautifulsoup4>=4.12" "lxml>=5.2"

      - name: Publish night attack summary
        id: attack
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: PYTHONPATH=src python -m telegram_net.cli attack $FORCE

      - name: Save state
        if: always() && steps.attack.outputs.save_state == 'true'
        run: |
          git config user.name "telegram-net-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "Night attack summary"
          git push || (git pull --rebase && git push)
